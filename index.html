<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27B3AC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ארגז המשחקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
/* Layout: one phone-sized column. Home = toy-box shelf of sticker tiles filtered by category chips; each game opens full-height under a slim bar. */
:root{
  --bg:#27B3AC; --ink:#1C1A33; --paper:#FFFBF2;
  --sun:#FFD23F; --berry:#FF5D73; --leaf:#7BD389; --sky:#5CC8FF; --grape:#A98BFF; --orange:#FF9F43; --pink:#FF8FC7; --peach:#FFB38A; --mint:#9EEBCF;
  --display:'Secular One','Varela Round',system-ui,sans-serif;
  --body:'Varela Round','Secular One',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:14px;padding-block:10px;box-sizing:border-box;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.18) 1.5px,transparent 2px);background-size:22px 22px}
button{font-family:var(--body);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0;color:var(--paper);text-shadow:0 3px 0 var(--ink);flex:1;line-height:1.1}
h1 small{font-size:.9rem;display:block;text-shadow:none;font-family:var(--body);opacity:.95}
.coins{background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:1.1rem;box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);font-size:1.05rem;padding:4px 10px;font-family:var(--display)}
.icon-btn:active,.btn:active,.tile:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.search{width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-family:var(--body);font-size:1rem;background:var(--paper);color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font-size:.9rem;white-space:nowrap}
.cat.on{background:var(--ink);color:var(--paper)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 2px 18px;align-content:start}
.tile{border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.tile .em{font-size:2.1rem;line-height:1.15}
.tile .nm{font-family:var(--display);font-size:.88rem;line-height:1.15;text-wrap:balance}
.empty{grid-column:1/-1;color:var(--paper);text-align:center;padding:30px 0}
/* game screen */
.bar{display:flex;align-items:center;gap:10px}
.bar h2{font-family:var(--display);font-weight:400;margin:0;flex:1;font-size:1.3rem;color:var(--paper);text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.stage.sc{overflow-y:auto}
.btn{border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:var(--sun);font-family:var(--display);font-size:1.05rem;padding:8px 16px}
.btn.big{font-size:1.35rem;padding:10px 28px}
.btn.sm{font-size:.9rem;padding:5px 10px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:var(--paper)}.btn.go{background:var(--leaf)}.btn.red{background:var(--berry)}
.ov{position:absolute;inset:0;background:rgba(28,26,51,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ovCard{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:20px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;animation:popIn .3s}
.ovCard h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;text-wrap:balance}
.ovCard p{margin:0;line-height:1.5}
.lvls{display:flex;flex-direction:column;gap:8px;width:100%}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:6px 18px;font-family:var(--display);font-size:1.15rem;z-index:99;animation:toast 1.6s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-family:var(--display);font-size:1.05rem;border-bottom:3px solid var(--ink);background:var(--sun);font-variant-numeric:tabular-nums;flex-wrap:wrap;flex:none}
.cvh{position:absolute;top:0;left:0;right:0;z-index:5;border-bottom:none;background:transparent;color:var(--paper);text-shadow:0 2px 0 var(--ink),0 0 4px var(--ink);pointer-events:none}
.stage canvas{display:block;touch-action:none;width:100%;height:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.lab{font-family:var(--display);font-size:.95rem;width:100%;text-align:start}
.chip{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 12px;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.stkc{font-size:1.3rem;padding:3px 9px}
.tools{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--ink);flex:none;background:var(--paper)}
.tools .row{justify-content:flex-start}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink)}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.ltr{direction:ltr}
.sq{display:grid;gap:6px;margin:auto;padding:12px;box-sizing:border-box;width:min(100%,420px);direction:ltr}
.sq>*{aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(1.1rem,6vw,1.9rem);background:#fff;padding:0;min-width:0}

/* candy */
.board{direction:ltr;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:min(100%,430px);aspect-ratio:1;margin:auto;padding:8px;box-sizing:border-box;touch-action:none}
.cell{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,6vw,1.9rem);border:2px solid rgba(28,26,51,.35);transition:transform .15s}
.cell.sel{transform:scale(1.12);border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.cell.pop{animation:pop .26s forwards}
.cell.fall{animation:fall .25s ease-out}
@keyframes pop{to{transform:scale(0) rotate(40deg);opacity:0}}
@keyframes fall{from{transform:translateY(-60%);opacity:.2}to{transform:none;opacity:1}}
.t0{background:#FFB3C6}.t1{background:#D4C1FF}.t2{background:#E7C8A8}.t3{background:#FFD08A}.t4{background:#FFF0A0}.t5{background:#B8E6FF}
.cBar{height:12px;margin:8px 12px 0;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;flex:none}
.cBar i{display:block;height:100%;width:0;background:var(--berry);transition:width .3s}

/* nails */
.hand{direction:ltr;display:flex;align-items:flex-end;justify-content:center;gap:2%;height:230px;min-height:200px;padding:14px 10px 0;background:linear-gradient(#FFE9F2,#FFF6E5);position:relative;flex:none}
.finger{width:15%;max-width:64px;background:#F3C7A1;border:3px solid var(--ink);border-bottom:none;border-radius:40px 40px 0 0;display:flex;justify-content:center;padding-top:8px;box-sizing:border-box}
.nail{width:72%;aspect-ratio:.72;border-radius:46% 46% 32% 32%;border:2px solid rgba(28,26,51,.6);background:#FBE1D2;position:relative;cursor:pointer;overflow:hidden}
.nail::after{content:"";position:absolute;top:10%;left:18%;width:22%;height:40%;border-radius:99px;background:rgba(255,255,255,.55)}
.nail .stk{position:absolute;font-size:clamp(.8rem,4vw,1.15rem);line-height:1;pointer-events:none}
.sparkle{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:3rem;animation:popIn .4s}

/* shop */
.shTop{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sun);border-bottom:3px solid var(--ink);flex-wrap:wrap;flex:none}
.money{font-family:var(--display);font-size:1.6rem;flex:1;font-variant-numeric:tabular-nums}
.floor{min-height:74px;padding:8px 12px;background:linear-gradient(#FFE7C2 0 62%,#E8B98A 62%);border-bottom:3px solid var(--ink);position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;font-size:1.5rem;overflow:hidden;flex:none}
.floor .lbl{position:absolute;top:4px;right:10px;font-size:.75rem;font-family:var(--display);opacity:.7}
.cust{position:absolute;bottom:6px;font-size:.95rem;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:2px 8px;animation:cust 2.2s forwards;white-space:nowrap}
@keyframes cust{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.tabs{display:flex;border-bottom:3px solid var(--ink);flex:none}
.tabs button{flex:1;border:none;background:#fff;font-family:var(--display);font-size:1rem;padding:9px 4px;border-inline-start:2px solid var(--ink)}
.tabs button:first-child{border-inline-start:none}
.tabs button.on{background:var(--orange)}
.panel{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:10px;background:#fff}
.pcard .pe{font-size:2.2rem;grid-row:span 2}
.pcard .pn{font-family:var(--display);font-size:1.05rem}
.pcard .pi{font-size:.85rem;color:#4a4766;font-variant-numeric:tabular-nums}
.pcard .pb{grid-row:span 2;display:flex;flex-direction:column;gap:6px}
.pcard.locked{background:repeating-linear-gradient(-45deg,#fff 0 10px,#f4efe4 10px 20px)}
.pcard.owned{background:#EAF8EC}
.fl{position:absolute;font-family:var(--display);pointer-events:none;animation:fl .8s forwards;color:var(--ink);z-index:9}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}

/* memory */
.mgrid{direction:ltr;display:grid;gap:8px;padding:12px;margin:auto;width:min(100%,420px);box-sizing:border-box}
.mcard{aspect-ratio:3/4;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;padding:2px;box-sizing:border-box}
.mcard .f{background:var(--grape);font-size:1.5rem;color:var(--paper);font-family:var(--display);background-image:radial-gradient(circle,rgba(255,255,255,.3) 2px,transparent 3px);background-size:14px 14px}
.mcard .b{background:#fff;transform:rotateY(180deg);font-size:clamp(1.6rem,8vw,2.4rem);font-family:var(--display)}
.mcard .b.tx{font-size:clamp(.8rem,3.6vw,1.1rem);word-break:break-word;line-height:1.1}
.mcard.done .b{background:#D8F5DD}

/* quiz */
.quiz-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.qpic{font-size:4.6rem;line-height:1.1;max-width:100%;word-break:break-all}
.qpic.cnt{font-size:2.2rem;letter-spacing:.1em;max-width:300px}
.qpic.frac{font-size:2.1rem;letter-spacing:0;direction:ltr}
.qtxt{font-family:var(--display);font-size:1.4rem;line-height:1.35;text-wrap:balance;max-width:100%}
.qtxt.qbig{font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.1}
.qtxt b{color:var(--berry);font-weight:400}
.gap{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--berry);color:var(--berry)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,360px)}
.opts .btn{font-size:1.7rem;padding:12px 6px;background:#fff;min-width:0;overflow-wrap:anywhere}
.opts.long .btn{font-size:1.05rem;padding:12px 6px}
.opts.emo .btn{font-size:2.4rem;padding:8px 6px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts .btn.right{background:var(--leaf)}.opts .btn.wrong{background:var(--berry)}
.timebar{height:12px;width:100%;border-bottom:3px solid var(--ink);background:#fff;flex:none}
.timebar i{display:block;height:100%;background:var(--sky);width:100%}

/* balloons */
.bstage{background:linear-gradient(#BDEBFF,#E9FAFF);touch-action:none}
.bln{position:absolute;left:0;top:0;width:64px;height:78px;border-radius:50% 50% 47% 47%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.9rem;color:var(--ink);cursor:pointer;will-change:transform}
.bln::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:34px;background:var(--ink)}
.bln::before{content:"";position:absolute;top:14%;left:22%;width:18%;height:26%;border-radius:50%;background:rgba(255,255,255,.6)}
.bln.popd{animation:bpop .2s forwards}
@keyframes bpop{to{transform:var(--t) scale(1.5);opacity:0}}
.target{font-family:var(--display);background:var(--berry);color:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:0 10px;display:inline-block}

/* misc dom games */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,360px);margin:auto;padding:12px;box-sizing:border-box}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#5B3A29 0 45%,#7BD389 47%);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,11vw,3.2rem);overflow:hidden}
.hole span{animation:up .15s}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
.tapbig{width:min(70vw,240px);aspect-ratio:1;border-radius:50%;font-size:4rem;background:var(--berry)}
.react{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:1.6rem;padding:20px;cursor:pointer;transition:background .1s}
.g2048{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,400px);aspect-ratio:1;margin:auto;padding:10px;box-sizing:border-box;background:#E9DDC7;border-radius:16px;touch-action:none}
.g2048 div{border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(1.1rem,6vw,1.9rem);background:#F6EEDF;border:2px solid rgba(28,26,51,.25)}
.maze{direction:ltr;display:grid;margin:auto;touch-action:none;background:#fff}
.maze div{box-sizing:border-box;border:0 solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(.9rem,4.4vw,1.4rem)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;padding:8px;direction:ltr}
.pad .btn{padding:6px 0;font-size:1.3rem}
.simon{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(80%,300px);aspect-ratio:1;margin:auto}
.simon button{border:4px solid var(--ink);border-radius:24px;opacity:.55;transition:opacity .1s,transform .1s}
.simon button.lit{opacity:1;transform:scale(1.05)}
.kbd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;max-width:420px}
.kbd button{width:38px;height:42px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-family:var(--display);font-size:1.2rem;padding:0}
.kbd button.hit{background:var(--leaf)}.kbd button.miss{background:#ddd;opacity:.6}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slots span{min-width:34px;height:44px;border-bottom:4px solid var(--ink);font-family:var(--display);font-size:1.8rem;display:flex;align-items:flex-end;justify-content:center}
.c4{direction:ltr;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#3A86FF;padding:8px;border-radius:16px;border:3px solid var(--ink);width:min(100%,400px);box-sizing:border-box;margin:auto}
.c4 div{aspect-ratio:1;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,5.5vw,1.7rem)}
.card{width:120px;height:170px;border:4px solid var(--ink);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:4rem;box-shadow:0 5px 0 var(--ink)}
/* creative */
.scene{flex:1;min-height:220px;position:relative;overflow:hidden;touch-action:none}
.pl{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab}
.padwrap{flex:1;min-height:200px;position:relative;background:#fff}
.keys{direction:ltr;display:flex;gap:4px;flex:1;padding:12px;min-height:200px}
.keys button{flex:1;border:3px solid var(--ink);border-radius:0 0 14px 14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-family:var(--display);font-size:1rem;min-width:0}
.keys.xylo{align-items:center}
.keys.xylo button{border-radius:12px;align-items:center;padding:0}
.keys button.lit{filter:brightness(.8);transform:translateY(3px)}
/* prize shop */
.shopbtn{background:var(--sun)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pgrid.two{grid-template-columns:1fr 1fr}
.pit{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;gap:2px;padding:4px;min-width:0}
.pit small{font-size:.72rem;font-family:var(--display)}
.pit.no{background:#EEE8DA;color:#9a95ad;font-family:var(--display);font-size:1.4rem}
.pit.sel{box-shadow:0 0 0 3px var(--sun),0 0 0 6px var(--ink)}
.pit.th{aspect-ratio:auto;padding:18px 6px;font-family:var(--display);font-size:1.1rem;color:#fff;text-shadow:0 1px 0 var(--ink),0 0 3px var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<style>body{margin:0;font-size:14px}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>
<div id="app" dir="rtl">
  <section class="screen" id="home">
    <div class="top">
      <h1><span id="ava"></span>ארגז המשחקים<small id="count"></small></h1>
      <button class="icon-btn" id="snd" aria-label="צליל">🔊</button>
      <button class="icon-btn shopbtn" id="shopBtn">🛍️ חנות</button>
      <div class="coins">🪙 <span class="coinNum">0</span></div>
    </div>
    <input class="search" id="q" type="search" placeholder="🔍 חיפוש משחק…" aria-label="חיפוש משחק">
    <div class="cats" id="cats"></div>
    <div class="grid" id="tiles"></div>
  </section>
  <section class="screen" id="play" hidden>
    <div class="bar">
      <button class="icon-btn" id="back">→ חזרה</button>
      <h2 id="gname"></h2>
      <div class="coins">🪙 <span class="coinNum">0</span></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<script>
/* ================= CORE ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function beep(f=600,d=.08,type='sine',v=.07){if(!soundOn)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d+.02)}catch(e){}}
const good=()=>{beep(880,.08);setTimeout(()=>beep(1175,.1),80)}, bad=()=>beep(200,.15,'sawtooth',.05);
function overlay(st,{title,text='',btn='התחל',onBtn,levels,onLevel}){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="ovCard"><h3>${title}</h3>${text?`<p>${text}</p>`:''}${levels?`<div class="lvls">${levels.map((l,i)=>`<button class="btn ${['go','','red'][i%3]}" data-l="${i}">${l}</button>`).join('')}</div>`:`<button class="btn big go">${btn}</button>`}</div>`;
  st.appendChild(o);
  o.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;o.remove();beep(700);if(b.dataset.l!=null)onLevel&&onLevel(+b.dataset.l);else onBtn&&onBtn()});
  return o;
}

function em(c,e,x,y,s,rot,flip){c.save();c.translate(x,y);if(rot)c.rotate(rot);if(flip)c.scale(-1,1);c.font=`${s}px ${EF}`;c.textAlign='center';c.textBaseline='middle';c.fillText(e,0,0);c.restore()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function stars(c,g,speed,n=50){c.fillStyle='#fff';for(let i=0;i<n;i++){const x=(i*97.3)%g.W,y=((i*53.7)+(g.off||0)*speed*(1+i%3)/2)%g.H;c.globalAlpha=.4+(i%3)*.2;c.fillRect(x,y,2,2)}c.globalAlpha=1}
/* canvas game frame */
function CG(st,o){
  st.innerHTML='<canvas></canvas><div class="hud cvh"></div>';
  const cv=$('canvas',st),ctx=cv.getContext('2d'),hud=$('.cvh',st);
  const g={W:0,H:0,run:false,t:0};let raf=0,last=0,alive=true,ready=false;
  const rs=()=>{const d=devicePixelRatio||1;g.W=st.clientWidth;g.H=st.clientHeight;cv.width=g.W*d;cv.height=g.H*d;ctx.setTransform(d,0,0,d,0,0);if(ready&&!g.run)o.draw(g,ctx)};
  rs();addEventListener('resize',rs);
  g.over=(title,text,earn)=>{g.run=false;beep(150,.35,'sawtooth',.07);award(earn);overlay(st,{title,text,btn:'עוד פעם',onBtn:start})};
  const H=()=>{hud.innerHTML=o.hud(g)};
  function loop(t){if(!alive||!g.run)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;g.t+=dt;o.step(g,dt);o.draw(g,ctx);H();if(g.run)raf=requestAnimationFrame(loop)}
  function start(){o.reset(g);g.run=true;g.t=0;last=0;H();raf=requestAnimationFrame(loop)}
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  let pressed=false,sx=0,sy=0;
  cv.addEventListener('pointerdown',e=>{pressed=true;const[x,y]=pos(e);sx=x;sy=y;if(g.run){o.down&&o.down(g,x,y);o.move&&o.move(g,x,y)}});
  cv.addEventListener('pointermove',e=>{if(g.run&&o.move&&(pressed||e.pointerType==='mouse')){const[x,y]=pos(e);o.move(g,x,y)}});
  cv.addEventListener('pointercancel',()=>{pressed=false;o.up&&o.up(g)});
  cv.addEventListener('pointerup',e=>{pressed=false;o.up&&o.up(g);if(!g.run)return;const[x,y]=pos(e),dx=x-sx,dy=y-sy;if(o.swipe&&Math.hypot(dx,dy)>24)o.swipe(g,Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));else o.tap&&o.tap(g,x,y)});
  const kd=e=>{if(!g.run||!o.key)return;const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',' ':'S'}[e.key];if(m){e.preventDefault();o.key(g,m)}};addEventListener('keydown',kd);
  o.reset(g);ready=true;o.draw(g,ctx);H();
  overlay(st,{title:o.title,text:o.help,onBtn:start});
  return()=>{alive=false;g.run=false;cancelAnimationFrame(raf);removeEventListener('resize',rs);removeEventListener('keydown',kd)}
}

const Quiz=v=>st=>{
  let score=0,i=0,lock=false,time=0,iv=0,cur,alive=true;const T=v.timed;
  st.innerHTML=`<div class="hud"><span>${T?'⏱ <b class="qt">'+T+'</b>':'שאלה <b class="qi">1</b>/10'}</span><span>⭐ <b class="qs">0</b></span></div>${T?'<div class="timebar"><i class="qb"></i></div>':''}<div class="quiz-wrap"><div class="qpic"></div><div class="qtxt"></div><div class="opts"></div></div>`;
  const P=$('.qpic',st),Q=$('.qtxt',st),O=$('.opts',st);
  function next(){lock=false;cur=v.gen();P.innerHTML=cur.pic||'';P.hidden=!cur.pic;P.className='qpic '+(cur.picCls||'');Q.innerHTML=cur.q||'';Q.hidden=!cur.q;Q.className='qtxt'+(cur.big?' qbig':'');Q.dir=cur.ltr?'ltr':'rtl';
    const os=cur.opts.map(String);O.className='opts'+(os.every(o=>!/[֐-׿A-Za-z0-9<>=]/.test(o))?' emo':os.some(o=>o.length>5)?' long':'')+(os.length===3?' three':'');
    O.innerHTML=os.map(o=>`<button class="btn" data-o="${o}">${o}</button>`).join('');if(!T)$('.qi',st).textContent=i+1}
  O.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;const ok=b.dataset.o===String(cur.a);
    if(ok){b.classList.add('right');score++;good()}else{b.classList.add('wrong');bad();const r=$$('button',O).find(x=>x.dataset.o===String(cur.a));r&&r.classList.add('right')}
    $('.qs',st).textContent=score;
    setTimeout(()=>{if(!alive)return;if(T){if(time>0)next()}else{i++;i<10?next():end()}},ok?(T?300:700):(T?700:1400))});
  function end(){clearInterval(iv);award(score);overlay(st,{title:score>=(T?15:8)?'🏆 מצוין!':'👏 כל הכבוד!',text:T?`ענית נכון על ${score} שאלות בדקה`:`${score} תשובות נכונות מתוך 10`,btn:'שוב',onBtn:go})}
  function go(){score=0;i=0;$('.qs',st).textContent=0;next();if(T){time=T;clearInterval(iv);iv=setInterval(()=>{time-=.1;$('.qt',st).textContent=Math.ceil(Math.max(0,time));$('.qb',st).style.width=Math.max(0,time/T*100)+'%';if(time<=0){lock=true;end()}},100)}}
  if(T)overlay(st,{title:v.title||'⏱ נגד השעון',text:'כמה תשובות נכונות תספיקו בדקה אחת?',onBtn:go});else go();
  return()=>{alive=false;clearInterval(iv)}
};

const CC=['#5CC8FF','#A98BFF','#7BD389','#FF9F43','#FFD23F','#FF8FC7'];
function carShape(c,cx,y,w,h,col){const x=cx-w/2;c.fillStyle='#1C1A33';for(const p of[.12,.68]){c.fillRect(x-4,y+h*p,6,h*.2);c.fillRect(x+w-2,y+h*p,6,h*.2)}
  rr(c,x,y,w,h,w*.28);c.fillStyle=col;c.fill();c.lineWidth=3;c.strokeStyle='#1C1A33';c.stroke();c.fillStyle='#DDF4FF';rr(c,x+w*.15,y+h*.2,w*.7,h*.2,6);c.fill();c.stroke();rr(c,x+w*.18,y+h*.64,w*.64,h*.14,5);c.fill();c.stroke()}
const Race=sk=>st=>{const LX=(g,l)=>g.W/3*(l+.5),dim=g=>{g.cw=Math.min(g.W/3*.55,58);g.ch=g.cw*1.75};
 return CG(st,{title:sk.t,help:'הקישו על צד שמאל או ימין של המסך כדי להחליף נתיב. התחמקו מהמכשולים ואספו מטבעות!',
  reset(g){dim(g);g.lane=1;g.x=g.W/2;g.o=[];g.sp=sk.sp;g.d=0;g.got=0;g.sn=.6;g.off=0},
  step(g,dt){dim(g);g.sp=Math.min(sk.sp*2.8,g.sp+9*dt);g.d+=g.sp*dt/12;g.off+=g.sp*dt;g.x+=(LX(g,g.lane)-g.x)*Math.min(1,dt*14);
   if((g.sn-=dt)<=0){g.sn=Math.max(.4,1.05-g.sp/1500);const l=rand(3);g.o.push(Math.random()<.32?{c:1,l,y:-40}:{l,y:-g.ch,v:sk.obs?0:40+rand(90),k:sk.obs?pick(sk.obs):pick(CC)})}
   const py=g.H-g.ch-22;
   for(const o of g.o){o.y+=(g.sp-(o.v||0))*dt;const near=Math.abs(LX(g,o.l)-g.x)<g.cw*.8;
    if(o.c){if(near&&o.y>py-10&&o.y<py+g.ch+10){o.dead=1;g.got++;beep(1200,.05,'square',.04)}}
    else if(near&&o.y+g.ch>py+8&&o.y<py+g.ch-8)return g.over('💥 בום!',`עברתם ${Math.floor(g.d)} מטר ואספתם ${g.got} מטבעות`,g.got+g.d/150)}
   g.o=g.o.filter(o=>!o.dead&&o.y<g.H+80)},
  draw(g,c){const W=g.W,H=g.H;
   if(sk.bg==='space'){c.fillStyle='#120F33';c.fillRect(0,0,W,H);stars(c,g,.4,70)}
   else if(sk.bg==='water'){c.fillStyle='#2A7FC9';c.fillRect(0,0,W,H);c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;for(let y=(g.off*.6)%50-50;y<H;y+=50){c.beginPath();for(let x=0;x<=W;x+=20)c.lineTo(x,y+Math.sin(x/20)*5);c.stroke()}}
   else{c.fillStyle=sk.bg==='night'?'#2B2D3A':'#4A4E5C';c.fillRect(0,0,W,H);for(let y=-40+g.off%80;y<H;y+=40){const i=Math.round((y-g.off%80)/40);c.fillStyle=i%2?'#FF5D73':'#FFFBF2';c.fillRect(0,y,8,40);c.fillRect(W-8,y,8,40)}
     c.fillStyle='#FFFBF2';for(let i=1;i<3;i++)for(let y=-60+g.off%60;y<H;y+=60)c.fillRect(W/3*i-3,y,6,30)}
   for(const o of g.o){const x=LX(g,o.l);if(o.c){c.beginPath();c.arc(x,o.y,g.cw*.34,0,7);c.fillStyle='#FFD23F';c.fill();c.lineWidth=3;c.strokeStyle='#1C1A33';c.stroke();c.fillStyle='#1C1A33';c.font=`bold ${g.cw*.36}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('₪',x,o.y+1)}
    else if(sk.obs)em(c,o.k,x,o.y+g.ch/2,g.ch*.75);else carShape(c,x,o.y,g.cw,g.ch,o.k)}
   const py=g.H-g.ch-22;if(sk.me)em(c,sk.me,g.x,py+g.ch/2,g.ch*.8,sk.rot||0);else carShape(c,g.x,py,g.cw,g.ch,sk.col||'#FF5D73')},
  down(g,x){g.lane=Math.max(0,Math.min(2,g.lane+(x<g.W/2?-1:1)));beep(400,.04)},
  key(g,k){if(k==='L'||k==='R')g.lane=Math.max(0,Math.min(2,g.lane+(k==='L'?-1:1)))},
  hud:g=>`<span>${Math.floor(g.d)} מ׳</span><span>🪙 ${g.got}</span>`})};

const Snake=st=>CG(st,{title:'🐍 נחש',help:'החליקו על המסך, או הקישו לכיוון שאליו הנחש צריך לפנות. אכלו תפוחים ואל תתנגשו בקיר או בזנב!',
 reset(g){g.cols=14;g.cs=Math.floor(g.W/g.cols);g.rows=Math.max(10,Math.floor((g.H-40)/g.cs));g.ox=(g.W-g.cols*g.cs)/2;g.oy=40+(g.H-40-g.rows*g.cs)/2;g.s=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];g.d={x:1,y:0};g.nd=g.d;g.acc=0;g.score=0;g.apple={x:9,y:5}},

  const isGood=it=>v.free?true:v.rule?v.rule(it.k):it.k===target;
  function newTarget(){if(v.free){$('#btx',st).innerHTML='פוצצו כמה שיותר!';return}if(v.rule){$('#btx',st).innerHTML=`פוצצו רק: <span class="target">${v.ruleText}</span>`;return}

  function spawn(){const W=st.clientWidth,H=st.clientHeight;let it;if(v.free)it=pick(v.items);else{const goods=v.items.filter(isGood),bads=v.items.filter(x=>!isGood(x));it=Math.random()<.42&&goods.length?pick(goods):pick(bads.length?bads:goods)}
    const d=document.createElement('div');d.className='bln';d.textContent=it.l;d.style.background=it.c||pick(BCL);st.appendChild(d);
    const b={el:d,it,x:8+Math.random()*(W-80),y:H+10,v:55+Math.random()*50+score*1.5,w:Math.random()*6};bl.push(b);
    d.addEventListener('pointerdown',e=>{e.preventDefault();if(!run||b.dead)return;if(isGood(it)){b.dead=1;score++;hits++;beep(900+rand(300),.08,'square',.04);d.style.setProperty('--t',`translate(${b.x}px,${b.y}px)`);d.classList.add('popd');setTimeout(()=>d.remove(),200);if(!v.rule&&!v.free&&hits%6===0){newTarget();toast('מטרה חדשה!')}}

  function loop(t){if(!run)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;time-=dt;if((sp-=dt)<=0){sp=v.free?.45:.65;spawn()}
    for(const b of bl){if(b.dead)continue;b.y-=b.v*dt;b.el.style.transform=`translate(${b.x+Math.sin(t/500+b.w)*8}px,${b.y}px)`;if(b.y<-110){b.dead=1;b.el.remove()}}
    bl=bl.filter(b=>!b.dead);$('#btm',st).textContent=Math.ceil(Math.max(0,time));
    if(time<=0){run=false;bl.forEach(b=>b.el.remove());bl=[];award(v.free?score/3:score);overlay(st,{title:'⏰ נגמר הזמן!',text:`פוצצתם ${score} בלונים`,btn:'עוד סיבוב',onBtn:go});return}raf=requestAnimationFrame(loop)}
  function go(){score=0;hits=0;time=45;last=0;$('#bs',st).textContent=0;newTarget();run=true;raf=requestAnimationFrame(loop)}
  newTarget();overlay(st,{title:v.t,text:v.free?'פוצצו כמה שיותר בלונים ב-45 שניות!':'פוצצו רק את הבלונים הנכונים. בלון לא נכון מוריד נקודה!',onBtn:go});
  return()=>{run=false;cancelAnimationFrame(raf)}};

const Candy=v=>st=>{const N=7,EM=v.em;
  let g=[],level=store.get('candy_'+v.key,1),score=0,moves=0,target=0,sel=null,busy=false,alive=true;
  st.innerHTML=`<div class="hud"><span>שלב <b id="cl"></b></span><span>נקודות <b id="cs"></b>/<span id="ct"></span></span><span>מהלכים <b id="cm"></b></span></div><div class="cBar"><i id="cbar"></i></div><div class="board" id="cb"></div>`;
  const B=$('#cb',st),cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.dataset.r=r;d.dataset.c=c;B.appendChild(d);cells.push(d)}
  const el=(r,c)=>cells[r*N+c];
  function hud(){$('#cl',st).textContent=level;$('#cs',st).textContent=score;$('#ct',st).textContent=target;$('#cm',st).textContent=moves;$('#cbar',st).style.width=Math.min(100,score/target*100)+'%'}
  function render(fresh){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=el(r,c),x=g[r][c];d.className='cell t'+x+(sel&&sel[0]==r&&sel[1]==c?' sel':'');d.textContent=EM[x];if(fresh&&fresh.has(r+','+c)){void d.offsetWidth;d.classList.add('fall')}}}
  function fill(){g=[];for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){let x;do x=rand(6);while((c>=2&&g[r][c-1]==x&&g[r][c-2]==x)||(r>=2&&g[r-1][c]==x&&g[r-2][c]==x));g[r][c]=x}}if(!hasMove())fill()}
  function find(){const m=new Set();for(let r=0;r<N;r++){let run=1;for(let c=1;c<=N;c++){if(c<N&&g[r][c]===g[r][c-1])run++;else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r+','+k);run=1}}}
    for(let c=0;c<N;c++){let run=1;for(let r=1;r<=N;r++){if(r<N&&g[r][c]===g[r-1][c])run++;else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k+','+c);run=1}}}return m}
  const sw=(a,b)=>{const t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t};
  function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){const b=[r+dr,c+dc];if(b[0]>=N||b[1]>=N)continue;sw([r,c],b);const ok=find().size>0;sw([r,c],b);if(ok)return true}return false}
  async function resolve(){let combo=1;while(alive){const m=find();if(!m.size)break;m.forEach(k=>{const[r,c]=k.split(',');el(+r,+c).classList.add('pop')});beep(500+combo*90,.1,'triangle');score+=m.size*10*combo;hud();await sleep(260);
      m.forEach(k=>{const[r,c]=k.split(',');g[+r][+c]=null});const fresh=new Set();
      for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r][c]!=null)col.push(g[r][c]);for(let r=N-1;r>=0;r--){if(col.length)g[r][c]=col.shift();else{g[r][c]=rand(6);fresh.add(r+','+c)}}}
      render(fresh);await sleep(230);combo++}
    if(alive&&!hasMove()){toast('ערבוב! 🔀');fill();render()}}
  async function trySwap(a,b){if(busy||b[0]<0||b[1]<0||b[0]>=N||b[1]>=N||Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])!==1)return;busy=true;sel=null;sw(a,b);render();await sleep(150);
    if(find().size){moves--;hud();await resolve();check()}else{sw(a,b);render();B.classList.add('shake');beep(200,.1);setTimeout(()=>B.classList.remove('shake'),350)}busy=false}
  function check(){if(!alive)return;if(score>=target){level++;store.set('candy_'+v.key,level);award(5+level*2);overlay(st,{title:'🎉 כל הכבוד!',text:`עברתם לשלב ${level}`,btn:'לשלב הבא',onBtn:startLvl})}
    else if(moves<=0)overlay(st,{title:'😅 נגמרו המהלכים',text:`הגעתם ל-${score} מתוך ${target}. נסו שוב!`,btn:'נסה שוב',onBtn:startLvl})}
  let down=null;
  B.addEventListener('pointerdown',e=>{const d=e.target.closest('.cell');if(!d||busy)return;down={r:+d.dataset.r,c:+d.dataset.c,x:e.clientX,y:e.clientY}});
  B.addEventListener('pointerup',e=>{if(!down||busy)return;const dx=e.clientX-down.x,dy=e.clientY-down.y,a=[down.r,down.c];down=null;
    if(Math.hypot(dx,dy)>18){trySwap(a,Math.abs(dx)>Math.abs(dy)?[a[0],a[1]+(dx>0?1:-1)]:[a[0]+(dy>0?1:-1),a[1]]);return}

  startLvl();return()=>{alive=false}};

function G2048(st){let b,score;const C={2:'#FFF3C4',4:'#FFE08A',8:'#FFB86B',16:'#FF9459',32:'#FF6B6B',64:'#FF4D6D',128:'#C77DFF',256:'#9B5DE5',512:'#5CC8FF',1024:'#2EC4B6',2048:'#7BD389'};

function Maze(st){let lv=1,R,C,w,p,off;

  const G=$('#mg',st),cnt=i=>nb(i).filter(j=>m[j]).length,nb=i=>{const r=i>>3,c=i&7,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const a=r+dr,b=c+dc;if((dr||dc)&&a>=0&&b>=0&&a<n&&b<n)o.push(a*n+b)}return o};

    if(first){first=false;const safe=[i,...nb(i)];let k=0;while(k<K){const j=rand(n*n);if(!m[j]&&!safe.includes(j)){m[j]=1;k++}}}
    if(m[i]){over=true;m.forEach((v,j)=>{if(v)rev[j]=1});render();bad();overlay(st,{title:'💥 בום!',text:'עליתם על מוקש',btn:'שוב',onBtn:go});return}
    open(i);beep(600,.03);render();if(rev.filter(Boolean).length===n*n-K){over=true;award(10);overlay(st,{title:'🚩 ניצחתם!',text:'מצאתם את כל המשבצות הבטוחות',btn:'שוב',onBtn:go})}});

function Simon(st){const COL=['#FF5D73','#7BD389','#5CC8FF','#FFD23F'],F=[330,392,494,587];let seq=[],i=0,busy=true,alive=true;

    if(ans.length===w.length){const ok=ans.map(a=>a.l).join('')===w;if(ok){score++;good();$('#ss',st).textContent=score;setTimeout(next,700)}else{bad();$('#sa',st).classList.add('shake');setTimeout(()=>{$('#sa',st).classList.remove('shake');ans=[];render()},450)}}});

function TTT(st){let b,turn,over,wins=store.get('tttW',0);const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  st.innerHTML=`<div class="hud"><span>אתם ❌ · המחשב ⭕</span><span>ניצחונות <b id="tw">${wins}</b></span></div><div class="center"><div class="sq" id="tg" style="grid-template-columns:repeat(3,1fr);width:min(100%,330px)"></div><div id="tm"></div></div>`;
  const G=$('#tg',st),win=p=>L.find(l=>l.every(i=>b[i]===p));
  const render=()=>{G.innerHTML=b.map((v,i)=>`<button data-i="${i}" style="font-size:clamp(2rem,12vw,3.4rem)">${v||''}</button>`).join('')};
  function ai(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);const tryW=p=>e.find(i=>{b[i]=p;const w=win(p);b[i]=null;return w});
    if(Math.random()<.2)return pick(e);let m=tryW('⭕');if(m!=null)return m;m=tryW('❌');if(m!=null)return m;if(!b[4])return 4;const cs=[0,2,6,8].filter(i=>!b[i]);return cs.length?pick(cs):pick(e)}
  function end(t,c){over=true;if(c){wins++;store.set('tttW',wins);$('#tw',st).textContent=wins;award(3)}setTimeout(()=>overlay(st,{title:t,btn:'משחק נוסף',onBtn:go}),500)}
  G.addEventListener('click',e=>{const x=e.target.closest('button');if(!x||over||turn)return;const i=+x.dataset.i;if(b[i])return;b[i]='❌';beep(600,.05);render();
    if(win('❌'))return end('🎉 ניצחתם!',1);if(b.every(Boolean))return end('🤝 תיקו');turn=1;setTimeout(()=>{b[ai()]='⭕';beep(400,.05);render();turn=0;if(win('⭕'))end('🤖 המחשב ניצח');else if(b.every(Boolean))end('🤝 תיקו')},450)});
  function go(){b=Array(9).fill(null);turn=0;over=false;render()}go();return()=>{}}
function Connect4(st){const R=6,C=7;let b,over,busy;
  st.innerHTML=`<div class="hud"><span>אתם 🔴 · המחשב 🟡</span><span>ארבעה ברצף מנצחים</span></div><div class="center"><div class="c4" id="cg"></div><p>הקישו על טור כדי להפיל דיסקית</p></div>`;
  const G=$('#cg',st);const render=()=>{G.innerHTML=b.map((v,i)=>`<div data-c="${i%C}">${v||''}</div>`).join('')};
  const drop=(c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r*C+c]){b[r*C+c]=p;return r*C+c}return -1};
  const winAt=(i,p)=>{const r=Math.floor(i/C),c=i%C;return[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const s of[1,-1]){let a=r+dr*s,bb=c+dc*s;while(a>=0&&a<R&&bb>=0&&bb<C&&b[a*C+bb]===p){n++;a+=dr*s;bb+=dc*s}}return n>=4})};
  const open=()=>[...Array(C).keys()].filter(c=>!b[c]);
  function ai(){const o=open();for(const p of['🟡','🔴'])for(const c of o){const i=drop(c,p),w=winAt(i,p);b[i]=null;if(w)return c}
    const safe=o.filter(c=>{const i=drop(c,'🟡');const bad=open().some(c2=>{const j=drop(c2,'🔴'),w=j>=0&&winAt(j,'🔴');if(j>=0)b[j]=null;return w});b[i]=null;return!bad});const pool=safe.length?safe:o;return pool.sort((a,b2)=>Math.abs(3-a)-Math.abs(3-b2)+(Math.random()-.5)*2.5)[0]}
  G.addEventListener('click',e=>{const d=e.target.closest('div[data-c]');if(!d||over||busy)return;const c=+d.dataset.c,i=drop(c,'🔴');if(i<0)return;beep(500,.05);render();
    if(winAt(i,'🔴')){over=true;award(6);return setTimeout(()=>overlay(st,{title:'🎉 ניצחתם!',btn:'משחק נוסף',onBtn:go}),400)}if(!open().length){over=true;return overlay(st,{title:'🤝 תיקו',btn:'שוב',onBtn:go})}
    busy=true;setTimeout(()=>{const j=drop(ai(),'🟡');beep(350,.05);render();busy=false;if(winAt(j,'🟡')){over=true;setTimeout(()=>overlay(st,{title:'🤖 המחשב ניצח',btn:'שוב',onBtn:go}),400)}},500)});
  function go(){b=Array(R*C).fill(null);over=false;busy=false;render()}go();return()=>{}}

const THEMES=[['טורקיז','#27B3AC',0],['כחול שמיים','#3A86FF',30],['ענבים','#7B5CD6',30],['שקיעה','#EE7B3A',40],['יער','#2E8B57',40],['ורוד סוכרייה','#E0559A',50],['לילה','#2B2D5A',60],['אדום לוהט','#D64545',60]];
const AVAS=[['🙂',0],['🐶',15],['🐱',15],['🐸',20],['🐼',25],['🦊',25],['🐯',30],['🐵',30],['🦁',40],['🐨',40],['🐙',50],['🦖',60],['🤖',70],['👽',70],['🦄',90],['🐲',120]];
const ALBUM='🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦆 🦉 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐢 🐍 🦖 🐙 🦑 🦀 🐠 🐬 🐳 🦈 🐊 🦓 🦒 🐘 🦛 🦘 🐫 🦔 🦜 🦚 🦩'.split(' ');
let PZ=store.get('prize',{themes:[0],theme:0,avas:[0],ava:0,album:[]});
function applyPrize(){document.documentElement.style.setProperty('--bg',THEMES[PZ.theme][1]);$('#ava').textContent=PZ.ava?AVAS[PZ.ava][0]+' ':''}
function Prizes(st){let tab='album';
  st.innerHTML=`<div class="shTop"><div class="money">🪙 <span class="coinNum">${coins}</span></div><span class="pi">אוספים מטבעות במשחקים וקונים כאן</span></div><div class="tabs"><button data-t="album" class="on">📒 אלבום</button><button data-t="ava">🙂 דמויות</button><button data-t="theme">🎨 רקעים</button></div><div class="panel" id="pp"></div>`;
  const pp=$('#pp',st),save=()=>store.set('prize',PZ);
  const spend=n=>{if(coins<n){toast(`חסרים עוד ${n-coins} 🪙`);bad();return false}coins-=n;store.set('coins',coins);showCoins();return true};
  function render(){let h='';
    if(tab==='album'){const got=new Set(PZ.album);h=`<div class="pcard"><span class="pe">🎁</span><span class="pn">חבילת הפתעה</span><span class="pb"><button class="btn sm" data-a="pack">קנה 🪙10</button></span><span class="pi">מדבקה חדשה לאלבום · אספתם ${got.size} מתוך ${ALBUM.length}</span></div><div class="pgrid">${ALBUM.map((e,i)=>`<div class="pit ${got.has(i)?'':'no'}">${got.has(i)?e:'?'}</div>`).join('')}</div>`}
    else if(tab==='ava')h=`<p class="pi">הדמות שתבחרו תופיע ליד שם האפליקציה.</p><div class="pgrid">${AVAS.map(([e,p],i)=>`<button class="pit ${PZ.ava===i?'sel':''}" data-a="ava" data-i="${i}">${e}<small>${PZ.avas.includes(i)?(PZ.ava===i?'✓ שלי':'בחר'):'🪙'+p}</small></button>`).join('')}</div>`;
    else h=`<p class="pi">צבע הרקע של כל האפליקציה.</p><div class="pgrid two">${THEMES.map(([n,c,p],i)=>`<button class="pit th ${PZ.theme===i?'sel':''}" data-a="theme" data-i="${i}" style="background:${c}">${n}<small>${PZ.themes.includes(i)?(PZ.theme===i?'✓ פעיל':'בחר'):'🪙'+p}</small></button>`).join('')}</div>`;
    pp.innerHTML=h}
  pp.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
    if(a==='pack'){const left=ALBUM.map((_,k)=>k).filter(k=>!PZ.album.includes(k));if(!left.length){toast('האלבום מלא! 🏆');return}if(!spend(10))return;const k=pick(left);PZ.album.push(k);good();toast(PZ.album.length===ALBUM.length?'השלמתם את כל האלבום! 🏆':'מדבקה חדשה: '+ALBUM[k])}
    if(a==='ava'){if(!PZ.avas.includes(i)){if(!spend(AVAS[i][1]))return;PZ.avas.push(i);good()}PZ.ava=i}
    if(a==='theme'){if(!PZ.themes.includes(i)){if(!spend(THEMES[i][2]))return;PZ.themes.push(i);good()}PZ.theme=i}
    save();applyPrize();render()});
  $$('.tabs button',st).forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$('.tabs button',st).forEach(x=>x.classList.toggle('on',x===b));render()});
  render();return()=>{}}

function renderCats(){$('#cats').innerHTML=CATSL.map(([k,n])=>`<button class="cat${k===cat?' on':''}" data-c="${k}">${n}${k==='all'?'':' · '+GAMES.filter(g=>g.cat===k).length}</button>`).join('')}
function renderTiles(){const q=$('#q').value.trim();const list=GAMES.filter(g=>(cat==='all'||g.cat===cat)&&(!q||g.n.includes(q)));
  $('#tiles').innerHTML=list.length?list.map(g=>`<button class="tile" data-g="${g.id}" style="background:${CATCOL[g.cat]}"><span class="em">${g.e}</span><span class="nm">${g.n}</span></button>`).join(''):'<p class="empty">לא נמצא משחק בשם הזה</p>'}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;cat=b.dataset.c;store.set('cat',cat);renderCats();renderTiles();$('#tiles').scrollTop=0});
$('#q').addEventListener('input',()=>{if($('#q').value&&cat!=='all'){cat='all';renderCats()}renderTiles()});
$('#shopBtn').onclick=()=>{beep(660,.06);openGame('prizes')};
function openGame(id){const g=id==='prizes'?{e:'🛍️',n:'חנות הפרסים',f:Prizes}:GAMES.find(x=>x.id===id);if(!g)return;cleanup&&cleanup();$('#home').hidden=true;$('#play').hidden=false;$('#gname').textContent=g.e+' '+g.n;
  const old=$('#stage'),st=old.cloneNode(false);old.replaceWith(st);st.innerHTML='';st.className='stage'+(SCROLL.has(g.n)||g.f.length===0?'':'')+(SCROLL.has(g.n)?' sc':'');requestAnimationFrame(()=>{try{cleanup=g.f(st)}catch(err){st.innerHTML='<div class="center">אופס, המשחק לא נטען. נסו שוב.</div>';console.error(err)}})}
function home(){cleanup&&cleanup();cleanup=null;const old=$('#stage'),st=old.cloneNode(false);old.replaceWith(st);$('#play').hidden=true;$('#home').hidden=false;showCoins()}
$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t){beep(660,.06);openGame(t.dataset.g)}});
$('#back').onclick=home;
$('#snd').textContent=soundOn?'🔊':'🔇';
$('#snd').onclick=()=>{soundOn=!soundOn;store.set('snd',soundOn);$('#snd').textContent=soundOn?'🔊':'🔇';beep(660)};
